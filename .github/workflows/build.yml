name: CH55x Firmware Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y sdcc
      - name: Build Firmware
        run: |
          qmk compile -kb reccarz/kw75s -km default || true
          ./compile.sh reccarz/kw75s default
      - name: Upload Firmware Files
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: "*.hex"
