name: CH55x Firmware Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      - name: Run compile.sh for reccarz/kw75s
        run: ./compile.sh reccarz/kw75s default

      - name: Upload Firmware Files
        uses: actions/upload-artifact@v3
        with:
          name: reccarz-kw75s-firmware
          path: |
            reccarz_kw75s_default.hex
            reccarz_kw75s_default.bin
